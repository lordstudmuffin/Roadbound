<title>Roadbound Quest Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one bound journal column; a ribbon of four tabs pinned to the bottom edge like page markers. */
:root{
  --paper:#ece2cb; --page:#f6efdd; --ink:#2a231a; --faded:#6d604c; --rule:#cdbf9f;
  --pine:#2f4b3b; --brass:#946a1f; --oxblood:#7c2f2a; --lake:#a9c0c0; --wash:#e3d7ba;
  --display:"IM Fell English","Iowan Old Style",Georgia,serif;
  --body:"Alegreya",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#191511; --page:#262019; --ink:#eadfc6; --faded:#a99b80; --rule:#4a3f30;
  --pine:#93b8a0; --brass:#d6a655; --oxblood:#e0958a; --lake:#35504f; --wash:#31291f; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#191511; --page:#262019; --ink:#eadfc6; --faded:#a99b80; --rule:#4a3f30;
  --pine:#93b8a0; --brass:#d6a655; --oxblood:#e0958a; --lake:#35504f; --wash:#31291f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%,var(--wash),transparent 60%)}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--pine)}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--rule);padding-bottom:10px}
.mast small{font-family:var(--hand);font-size:1.15rem;color:var(--brass)}
.note{font-family:var(--hand);font-size:1.25rem;line-height:1.25;color:var(--pine)}
.faded{color:var(--faded)} .small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.page{background:var(--page);border:1px solid var(--rule);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 1px 0 var(--rule),0 2px 0 var(--page),0 3px 0 var(--rule)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1 1 180px;min-width:0}
.rule{border:0;border-top:1px dashed var(--rule);margin:2px 0}
dl.facts{display:grid;grid-template-columns:minmax(84px,auto) 1fr;gap:6px 12px;margin:0}
dl.facts dt{color:var(--faded);font-size:.9rem;padding-top:2px} dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pine);color:var(--page);border:1px solid var(--pine);border-radius:3px;padding:10px 16px;font-family:var(--display);font-size:1.08rem}
.btn.ghost{background:transparent;color:var(--pine)}
.btn.warn{background:transparent;color:var(--oxblood);border-color:var(--oxblood)}
.btn.sm{padding:6px 10px;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:150px;line-height:1.45}
label.tick{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
label.tick input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--pine)}
.chip{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:1px 10px;font-size:.85rem;color:var(--faded);white-space:nowrap}
.chip.ok{color:var(--pine);border-color:var(--pine)} .chip.bad{color:var(--oxblood);border-color:var(--oxblood)} .chip.gold{color:var(--brass);border-color:var(--brass)}
.stamp{font-family:var(--display);font-style:italic;color:var(--oxblood);border:2px solid var(--oxblood);border-radius:4px;padding:2px 10px;transform:rotate(-3deg);display:inline-block;align-self:flex-start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--rule);background:transparent;border-radius:3px;padding:6px 10px;font-size:.95rem}
.seg button[aria-pressed=true]{background:var(--pine);color:var(--page);border-color:var(--pine)}
.chal{border-left:3px solid var(--rule);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.chal.boss{border-left-color:var(--oxblood)} .chal.done{border-left-color:var(--pine)}
.secret{background:var(--wash);border:1px dashed var(--brass);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:8px}
.banner{border:1px solid var(--oxblood);color:var(--oxblood);border-radius:3px;padding:10px 12px;background:var(--page)}
.safety{border:2px solid var(--pine);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--wash);border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.seal{width:46px;height:46px;border-radius:50%;background:var(--oxblood);color:var(--page);display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;flex:none}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.pips{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pips button{width:30px;height:30px;border:1px solid var(--rule);background:transparent;border-radius:50%;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos figure{margin:0;background:var(--paper);border:1px solid var(--rule);padding:5px 5px 2px;display:flex;flex-direction:column;gap:2px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photos figcaption{font-family:var(--hand);font-size:1rem;display:flex;justify-content:space-between;gap:6px}
.photos figcaption button{border:0;background:none;color:var(--oxblood);font-size:.8rem;font-family:var(--body);padding:0}
.story{font-family:var(--display);font-size:1.1rem;white-space:pre-wrap;line-height:1.45}
.mapbox{background:var(--page);border:1px solid var(--rule);border-radius:3px;padding:6px}
.mapbox svg{width:100%;height:auto;display:block}
.entry summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:center}
.entry summary::-webkit-details-marker{display:none}
.entry summary img{width:56px;height:56px;object-fit:cover;border:1px solid var(--rule);flex:none}
.entry[open] summary{margin-bottom:10px}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
ol.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ol.plan li{display:grid;grid-template-columns:74px 1fr;gap:10px}
ol.plan time{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--page);border-top:3px double var(--rule);
  display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1 1 0;max-width:180px;border:0;background:none;padding:12px 4px 10px;font-family:var(--display);font-size:1.05rem;color:var(--faded);border-top:3px solid transparent;margin-top:-3px}
nav.tabs button[aria-current=page]{color:var(--pine);border-top-color:var(--pine)}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.steps li{flex:1 1 0;min-width:0;text-align:center;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faded);border-top:3px solid var(--rule);padding-top:5px}
.steps li.past{border-top-color:var(--pine);color:var(--pine)}
.steps li.now{border-top-color:var(--brass);color:var(--ink);font-weight:700}
.maplink{display:inline-flex;align-items:center;gap:3px;font-size:.9rem;white-space:nowrap}
.maplink svg{width:14px;height:14px;flex:none}
.btn{min-height:44px} .btn.sm{min-height:40px}
.seg button{min-height:44px;padding:8px 14px}
.pips button{width:38px;height:38px}
label.tick{padding:8px 0} label.tick input{width:26px;height:26px;margin-top:0}
.btn:active,.seg button:active,nav.tabs button:active,.pips button:active{transform:translateY(1px)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.92rem;padding:8px 4px 8px}
nav.tabs svg{width:22px;height:22px}
.syncline{font-size:.85rem;color:var(--faded);margin-top:-8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--faded);margin-right:6px}
.dot.ok{background:var(--pine)} .dot.bad{background:var(--oxblood)} .dot.busy{background:var(--brass)}
.heads{border:1px solid var(--brass);border-left:5px solid var(--brass);border-radius:3px;padding:10px 12px;background:var(--page)}
.count{font-weight:400;letter-spacing:0;text-transform:none;color:var(--faded);margin-left:8px}
.photos img{cursor:zoom-in}
.light{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.light img{max-width:100%;max-height:100%;object-fit:contain;border:6px solid #f6efdd}
@media (prefers-reduced-motion:no-preference){ .pulse{animation:pulse 2.4s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.35}}
</style>

<div class="wrap">
  <header class="mast">
    <h1>Roadbound Quest Log</h1>
    <small id="mastNote">two adventurers, one Sentra</small>
  </header>
  <p id="syncLine" class="syncline" hidden></p>
  <div id="alerts" class="stack"></div>
  <main id="view" class="stack" style="gap:16px">
    <section class="page"><p class="note">Opening the journal…</p><p class="faded">Your party, quests and scrapbook will appear here once the shared log answers.</p></section>
  </main>
</div>
<nav class="tabs" aria-label="Journal sections">
  <button data-tab="quest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.500-6-10a6 6 0 0 1 12 0c0 4.500-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>Quest</button>
  <button data-tab="party"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="3"/><circle cx="16.500" cy="9.500" r="2.500"/><path d="M2.500 19c.500-3 2.700-4.500 5.500-4.500s5 1.500 5.500 4.500M15 14.600c.500-.100 1-.100 1.500-.100 2.600 0 4.500 1.500 5 4.500"/></svg>Party</button>
  <button data-tab="scrapbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Scrapbook</button>
  <button data-tab="camp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 3 20h18z"/><path d="M12 13l-2.500 7h5z"/></svg>Camp</button>
</nav>

<script>
(function(){
"use strict";
/* ---------- fixed game data ---------- */
var STATS=[["nav","Navigation"],["charm","Charm"],["nerve","Nerve"],["eye","Eagle Eye"],["snack","Snack Sense"]];
var CLASSES={
  pathfinder:{n:"Pathfinder",b:{nav:2},t:"Never lost, only scouting."},
  bard:{n:"Road Bard",b:{charm:2},t:"Keeper of the playlist and the running bit."},
  daredevil:{n:"Daredevil",b:{nerve:2},t:"Orders the strangest thing on the menu first."},
  scout:{n:"Hawk-eyed Scout",b:{eye:2},t:"Spots the hidden detail from the parking lot."},
  sage:{n:"Snack Sage",b:{snack:2},t:"Knows where the good dessert is. Always."},
  chronicler:{n:"Chronicler",b:{eye:1,charm:1},t:"If there's no photo, it didn't happen."}
};
var START_POINTS=6;
var LEVEL_TITLES=["Fresh Boots","Sunday Driver","Backroad Regular","Seasoned Wayfarer","Wasatch Wanderer","Keeper of Odd Places","Legend of the Interstate"];
var PARTY_TITLES=["Strangers at the Trailhead","The Two-Seat Fellowship","Backroad Regulars","Wardens of the Weird","Legends of I-15"];
var LOOT=["Brass Compass of Mild Confidence","Thermos of Holding","Gas Station Sunglasses of Truth","The Map Nobody Can Refold","Lucky Ice Scraper","Aux Cord of Command","Mitten of Left-Hand Warmth","Receipt of Unknown Origin","Bottomless Bag of Road Snacks","Blanket of +2 Cozy","Flashlight of Dramatic Storytelling","Charger of Last Resort","Souvenir Penny, Slightly Squashed","Scarf of Wind Resistance","Travel Mug of Second Wind","Postcard From a Place You Just Left"];
var WINTER=[["gas","Full gas tank"],["blankets","Blankets"],["water","Water"],["snacks","Snacks"],["charger","Phone charger"],["flashlight","Flashlight"],["scraper","Ice scraper"]];
var OATH=[
 "We always travel together in one car and never split up. Duels happen side by side.",
 "Remote or isolated spots are daylight-only, and we are back on main roads before dark.",
 "Night quests happen only in busy, well-lit public places.",
 "No abandoned buildings, private property, closed areas or anything that could be trespassing.",
 "Only paved or well-maintained roads a Sentra can handle, checked against current winter conditions.",
 "Every quest carries a safety card: cell coverage, nearest gas, nearest hospital and when we'll be back.",
 "Before each trip we share our location with a trusted person, and we check in when we're home.",
 "Winter checklist before every trip: gas, blankets, water, snacks, charger, flashlight, ice scraper.",
 "Either of us can veto a quest or bail at any time. No penalty. Bailing earns a reward."
];
var FINAL={done:1,vetoed:1,bailed:1};

/* ---------- state ---------- */
var S={db:null,sample:null,loaded:{party:false,quests:false,runs:false},slow:false,dead:false,readOnly:false,err:"",
  party:null,quests:[],runs:{},tab:lsGet("rq.tab")||"quest",who:lsGet("rq.who")||"",qid:null,
  draft:null,peek:{},confirm:"",photos:{},photoBusy:false,storyBusy:false,storyErr:"",mem:{},openEntry:null,triv:{},open:{},edit:null,photosLoaded:false};

function lsGet(k){try{return window.localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{window.localStorage.setItem(k,v)}catch(e){} }
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return /^https:\/\//i.test(String(u||""))?String(u):""}
function $(id){return document.getElementById(id)}
function dOpen(k){return ' data-d="'+esc(k)+'"'+(S.open[k]?" open":"")}
var PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.500-6-10a6 6 0 0 1 12 0c0 4.500-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>';
function mapLink(qy){qy=String(qy||"").trim();if(!qy)return "";return ' <a class="maplink" href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(qy)+'" target="_blank" rel="noopener">'+PIN+'Map</a>'}
function firstBit(t){return String(t||"").split(/\. /)[0].replace(/\.$/,"")}
function steps(st){
  var si={briefing:0,accepted:1,out:2,home:3,done:4}[st];if(si==null)return "";
  return '<ol class="steps" aria-label="Quest progress">'+["Briefing","Pack","Road","Home","Sealed"].map(function(n,i){return '<li class="'+(i<si?"past":i===si?"now":"")+'"'+(i===si?' aria-current="step"':'')+'>'+n+'</li>'}).join("")+'</ol>';
}
function syncLine(){
  var el=$("syncLine"),y=window.RQ&&window.RQ.sync;if(!el)return;
  if(!y||!y.code()){el.hidden=true;return}
  var c="ok",t="Linked with your partner's phone";
  if(y.rejected()){c="bad";t="The shared journal turned a change away. See Camp."}
  else if(y.offline()){c="busy";t="No connection. Changes are kept here and sent later."}
  else if(y.pending()){c="busy";t="Sending changes…"}
  else if(!y.lastOk()){c="busy";t="Linking…"}
  el.hidden=false;el.innerHTML='<span class="dot '+c+'"></span>'+esc(t);
}
function pname(pid){var p=S.party&&S.party[pid];return (p&&p.name)||(pid==="p1"?"Player one":"Player two")}
function other(pid){return pid==="p1"?"p2":"p1"}
function mine(){return S.who==="both"?["p1","p2"]:(S.who==="p1"||S.who==="p2")?[S.who]:[]}

/* ---------- levels ---------- */
function levelOf(xp){var n=1;while(xp>=50*n*(n+1))n++;return n}
function floorOf(n){return n<=1?0:50*(n-1)*n}
function statOf(p,k){var base=1+((p.stats&&p.stats[k])||0);var b=(CLASSES[p.cls]||{b:{}}).b[k]||0;return base+b}
function spent(p){var t=0;STATS.forEach(function(s){t+=(p.stats&&p.stats[s[0]])||0});return t}

/* ---------- rewards ---------- */
function computeRewards(q,run){
  var out={p1:{xp:0,gold:0,lines:[]},p2:{xp:0,gold:0,lines:[]}};
  function add(pid,xp,gold,why){out[pid].xp+=xp;out[pid].gold+=gold;out[pid].lines.push(why+" +"+xp+" XP"+(gold?", +"+gold+" gold":""))}
  var ch=q.challenges||{};
  ["p1","p2"].forEach(function(pid){
    var p=(S.party&&S.party[pid])||{};
    add(pid,30,0,"Quest completed");
    (ch.coop||[]).forEach(function(c){ if(run.coop&&run.coop[c.id]){ add(pid,15+(c.stat?statOf(p,c.stat):0),5,"Co-op: "+c.title) } });
    (ch.duels||[]).forEach(function(d){ var w=run.duels&&run.duels[d.id]; if(!w)return;
      if(w==="tie")add(pid,12,5,"Duel tied: "+d.title);
      else if(w===pid)add(pid,20+(d.stat?statOf(p,d.stat):0),10,"Duel won: "+d.title);
      else add(pid,5,0,"Duel fought: "+d.title); });
    var r=run.reveals&&run.reveals[pid];
    if(r){ if(r.ok)add(pid,25,10,"Secret objective pulled off"); else add(pid,5,0,"Secret objective attempted"); }
    if(run.boss==="win")add(pid,50,20,"Boss beaten: "+((ch.boss||{}).name||"the boss"));
    else if(run.boss==="loss")add(pid,15,0,"Faced the boss");
    if(run.modOk==="yes")add(pid,15,0,"Kept to the modifier");
    if(run.checkin)add(pid,5,0,"Checked in safe at home");
  });
  return out;
}
function totals(){
  var t={p1:{xp:0,gold:0,loot:[],titles:[]},p2:{xp:0,gold:0,loot:[],titles:[]}};
  Object.keys(S.runs).forEach(function(k){var r=S.runs[k].rewards;if(!r)return;
    ["p1","p2"].forEach(function(pid){var x=r[pid]||{};t[pid].xp+=x.xp||0;t[pid].gold+=x.gold||0;
      (x.loot||[]).forEach(function(l){t[pid].loot.push(l)});(x.titles||[]).forEach(function(l){t[pid].titles.push(l)});});});
  return t;
}
function achievements(){
  var runs=Object.keys(S.runs).map(function(k){return S.runs[k]});
  var done=runs.filter(function(r){return r.status==="done"}),a=[];
  function has(n,t){a.push({n:n,t:t})}
  if(done.length>=1)has("First Quest Together","Finished your first quest as a party.");
  [3,5,10,20].forEach(function(n){if(done.length>=n)has(n+" Quests Together","Finished "+n+" quests side by side.")});
  if(done.some(function(r){return r.boss==="win"}))has("Boss Slayers","Beat a location boss as a team.");
  if(runs.some(function(r){return r.status==="bailed"}))has("Lived to Quest Another Day","Bailed when it was the smart call.");
  if(runs.some(function(r){return r.status==="vetoed"}))has("Wise Counsel","Used a veto. The party is better for it.");
  if(done.some(function(r){return r.reveals&&((r.reveals.p1&&r.reveals.p1.ok)||(r.reveals.p2&&r.reveals.p2.ok))}))has("Secret Agent","Pulled off a secret objective.");
  if(done.some(function(r){return r.reveals&&r.reveals.p1&&r.reveals.p1.ok&&r.reveals.p2&&r.reveals.p2.ok}))has("Double Agents","Both secret objectives pulled off on the same quest.");
  if(done.some(function(r){return r.modOk==="yes"}))has("By the Rules of the Road","Finished a quest while keeping to its modifier.");
  var w1=0,w2=0;done.forEach(function(r){Object.keys(r.duels||{}).forEach(function(k){if(r.duels[k]==="p1")w1++;if(r.duels[k]==="p2")w2++})});
  if(w1&&w2)has("Friendly Rivalry","Each of you has won a duel.");
  if(done.some(function(r){return (r.photoCount||0)>=5}))has("Photo Finish","Five photos or more from one trip.");
  done.forEach(function(r){var q=questById(r.q);if(q&&q.achievement&&q.achievement.name)has(q.achievement.name,q.achievement.text||"")});
  return a;
}
function questById(id){for(var i=0;i<S.quests.length;i++)if(S.quests[i].id===id)return S.quests[i];return null}

/* ---------- writes ---------- */
var chains={};
function write(key,fn){
  chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(function(e){
    if(e&&e.code==="invalid_argument"){S.readOnly=true}
    else S.err="That change didn't save. Check your connection and try again.";
    render();
  });
  return chains[key];
}
function runPatch(qid,patch){
  if(!S.db)return Promise.resolve();
  return write("runs/"+qid,function(){var ref=S.db.doc("runs/"+qid);
    if(S.runs[qid])return ref.update(patch);
    var body={q:qid};for(var k in patch)body[k]=patch[k];return ref.set(body)});
}
function partySet(body){ if(!S.db)return; return write("party",function(){return S.db.doc("party/main").set(body)}) }
function partyPatch(patch){ if(!S.db)return; return write("party",function(){return S.db.doc("party/main").update(patch)}) }

/* ---------- secrets (kept on this phone only until revealed) ---------- */
function secretIndex(q,pid){
  var pool=((q.challenges||{}).secrets)||[];if(!pool.length)return -1;
  var key="rq.secret."+q.id+"."+pid,v=lsGet(key);if(v==null)v=S.mem[key];
  if(v!=null&&pool[+v])return +v;
  var mineIdx=[];for(var i=0;i<pool.length;i++){if((i%2===0)===(pid==="p1"))mineIdx.push(i)}
  if(!mineIdx.length)mineIdx=[0];
  var pick=mineIdx[Math.floor(Math.random()*mineIdx.length)];
  lsSet(key,String(pick));S.mem[key]=String(pick);return pick;
}

/* ---------- boot ---------- */
function boot(){
  var slowT=setTimeout(function(){S.slow=true;render()},10000);
  function got(k){S.loaded[k]=true;if(S.loaded.party&&S.loaded.quests&&S.loaded.runs){clearTimeout(slowT);S.slow=false}scheduleRender()}
  function fail(){clearTimeout(slowT);S.dead=true;render()}
  if(!window.claude||!window.claude.use){S.dead=true;render();return}
  window.claude.use("db").then(function(db){
    if(!db){S.dead=true;clearTimeout(slowT);render();return}
    S.db=db;
    db.doc("party/main").onSnapshot(function(s){S.party=s.exists?s.data():null;got("party")},fail);
    db.collection("quests").onSnapshot(function(s){S.quests=s.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x})
      .sort(function(a,b){return (b.number||0)-(a.number||0)});got("quests")},fail);
    db.collection("runs").onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});S.runs=m;got("runs")},fail);
    db.collection("photos").onSnapshot(function(s){var m={};s.docs.forEach(function(d){var x=Object.assign({},d.data());x.id=d.id;(m[x.q]=m[x.q]||[]).push(x)});
      Object.keys(m).forEach(function(k){m[k].sort(function(a,b){return (a.at||0)-(b.at||0)})});S.photos=m;S.photosLoaded=true;scheduleRender()},function(){S.photosLoaded=true});
  });
  window.claude.use("sample").then(function(f){S.sample=f||null});
}
var pending=false,pressing=false,queued=false,pressT=0;
function release(){pressing=false;if(queued){queued=false;render()}}
document.addEventListener("pointerdown",function(){pressing=true;clearTimeout(pressT);pressT=setTimeout(release,1500)},true);
document.addEventListener("pointerup",function(){clearTimeout(pressT);pressT=setTimeout(release,400)},true);
document.addEventListener("pointercancel",function(){clearTimeout(pressT);release()},true);
document.addEventListener("click",function(){clearTimeout(pressT);pressing=false},true);
function scheduleRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&(a.type==="text"||a.type==="number")))&&$("view").contains(a)){pending=true;return}
  render();
}
document.addEventListener("focusout",function(){if(pending){pending=false;setTimeout(scheduleRender,0)}});

/* ---------- render ---------- */
function render(){
  if(pressing){queued=true;return}
  queued=false;syncLine();
  var tabs=document.querySelectorAll("nav.tabs button");
  for(var i=0;i<tabs.length;i++){if(tabs[i].dataset.tab===S.tab)tabs[i].setAttribute("aria-current","page");else tabs[i].removeAttribute("aria-current")}
  var al="";
  if(S.dead)al+='<div class="banner"><strong>The shared log can\'t be reached from here.</strong> Open this page from its claude.ai link while signed in. Nothing on this page can be saved until then.</div>';
  else if(S.slow)al+='<div class="banner">Still trying to reach the shared log. What you see may be out of date.</div>';
  if(S.readOnly)al+='<div class="banner"><strong>This phone can read the log but can\'t write to it.</strong> Mark challenges and reveals on the other phone. See Camp for how to fix it.</div>';
  if(S.err)al+='<div class="banner">'+esc(S.err)+' <button class="btn sm ghost" data-act="clearErr">Dismiss</button></div>';
  $("alerts").innerHTML=al;
  var t=totals(),plv=levelOf(Math.floor((t.p1.xp+t.p2.xp)/2));
  $("mastNote").textContent=S.party?("Party level "+plv+" · "+PARTY_TITLES[Math.min(plv-1,PARTY_TITLES.length-1)]):"two adventurers, one Sentra";
  var allLoaded=S.loaded.party&&S.loaded.quests&&S.loaded.runs,h;
  if(!allLoaded&&!S.dead&&S.tab!=="camp")h='<section class="page"><p class="note">Opening the journal…</p><p class="faded">Your party, quests and scrapbook will appear here once the shared log answers.</p></section>';
  else if(S.tab==="party")h=viewParty();
  else if(S.tab==="scrapbook")h=viewScrapbook();
  else if(S.tab==="camp")h=viewCamp();
  else h=viewQuest();
  $("view").innerHTML=h;
}

/* ----- who holds this phone ----- */
function whoPicker(){
  return '<div class="stack"><p class="eyebrow">Who is holding this phone?</p><div class="seg">'+
   [["p1",pname("p1")],["p2",pname("p2")],["both","Both of us (we pass one phone)"]].map(function(o){
     return '<button data-act="who" data-v="'+o[0]+'" aria-pressed="'+(S.who===o[0])+'">'+esc(o[1])+'</button>'}).join("")+
   '</div><p class="small faded">This decides whose secret objective this phone shows. It is remembered on this phone only.</p></div>';
}

/* ----- QUEST ----- */
function currentQuest(){
  var i,r;
  if(S.qid){var q=questById(S.qid);if(q)return q}
  for(i=0;i<S.quests.length;i++){r=S.runs[S.quests[i].id];if(r&&{accepted:1,out:1,home:1}[r.status])return S.quests[i]}
  for(i=0;i<S.quests.length;i++){r=S.runs[S.quests[i].id];if(!r||!FINAL[r.status])return S.quests[i]}
  return S.quests[0]||null;
}
function viewQuest(){
  if(!S.quests.length)return '<section class="page"><h2>No quest on the board yet</h2><p>A new quest is posted here each Friday. Each one is a real place, checked for hours, cost, roads and season before it reaches you.</p><p class="note">Until then: roll your characters on the Party page.</p></section>';
  var q=currentQuest(),run=S.runs[q.id]||{},st=run.status||"briefing",h="";
  if(!S.party)h+='<section class="page"><p class="note">You haven\'t rolled characters yet.</p><p>You can read the quest now, but make your two adventurers on the Party page before you set out so the XP has somewhere to go.</p><div><button class="btn sm" data-tab="party">Create our characters</button></div></section>';
  h+=questHeader(q,run,st);
  if(st==="briefing")h+=briefing(q,run);
  else if(st==="accepted")h+=preflight(q,run);
  else if(st==="out")h+=onTheRoad(q,run);
  else if(st==="home")h+=homeAgain(q,run);
  else h+=closedQuest(q,run);
  if(S.quests.length>1)h+='<section class="page"><p class="eyebrow">Quest board</p><div class="stack">'+S.quests.map(function(x){var r=S.runs[x.id]||{};
    return '<div class="row"><span class="grow">No. '+esc(x.number)+' · '+esc(x.title)+'</span><span class="chip">'+esc(statusWord(r.status))+'</span>'+(x.id===q.id?'':'<button class="btn sm ghost" data-act="open" data-q="'+esc(x.id)+'">Open</button>')+'</div>'}).join("")+'</div></section>';
  return h;
}
function statusWord(s){return{accepted:"packing",out:"on the road",home:"home, wrapping up",done:"conquered",vetoed:"vetoed",bailed:"bailed"}[s]||"waiting"}
function questHeader(q,run,st){
  var p=q.place||{},d=q.drive||{};
  var h='<section class="page"><div class="row" style="justify-content:space-between"><p class="eyebrow">Quest No. '+esc(q.number)+(q.season?' · Season '+esc(q.season):'')+'</p><span class="chip">'+esc(statusWord(st))+'</span></div>'+
   steps(st)+'<h2>'+esc(q.title)+'</h2>'+(q.tagline?'<p class="note">'+esc(q.tagline)+'</p>':'')+
   '<p>'+esc(q.why)+'</p>'+
   '<dl class="facts"><dt>Where</dt><dd><strong>'+esc(p.name)+'</strong><br>'+esc(p.address)+mapLink(p.map||((p.name||"")+", "+(p.address||"")))+'</dd>'+
   '<dt>Hours</dt><dd>'+esc(p.hours)+'</dd><dt>Cost</dt><dd>'+esc(p.cost)+'</dd>'+
   (p.parking?'<dt>Parking</dt><dd>'+esc(p.parking)+'</dd>':'')+
   '<dt>The drive</dt><dd>'+esc(d.summary)+'</dd>'+
   (q.bestDays?'<dt>Go on</dt><dd>'+esc(q.bestDays)+'</dd>':'')+'</dl>';
  if(run.modifier)h+='<div class="secret"><p class="eyebrow">This week\'s modifier</p><p><strong>'+esc(run.modifier.name)+'.</strong> '+esc(run.modifier.text)+'</p></div>';
  return h+'</section>';
}
function conditions(q){
  var c=q.conditions||{};
  return '<section class="page"><p class="eyebrow">Season and roads · checked '+esc(c.checked)+'</p><dl class="facts">'+
   '<dt>Forecast</dt><dd>'+esc(c.forecast)+'</dd><dt>Roads</dt><dd>'+esc(c.roads)+'</dd><dt>Sunset</dt><dd>'+esc(c.sunset)+'</dd>'+
   '<dt>Sentra</dt><dd>'+esc(c.car)+'</dd></dl>'+
   (q.unverified&&q.unverified.length?'<p class="eyebrow" style="color:var(--oxblood)">Could not confirm</p><ul class="plain">'+q.unverified.map(function(u){return '<li>'+esc(u)+'</li>'}).join("")+'</ul>':'')+
   '<p class="small faded">Conditions change. Look at the forecast and the UDOT Traffic app again on the morning you go.</p></section>';
}
function planBlock(q){
  var pl=q.plan||{},rs=q.restStop,sk=q.skySpot,co=q.costs||{};
  var h='<section class="page"><p class="eyebrow">The plan</p><ol class="plan">'+(pl.steps||[]).map(function(s){return '<li><time>'+esc(s.time)+'</time><span>'+esc(s.text)+'</span></li>'}).join("")+'</ol>';
  if(rs)h+='<hr class="rule"><p class="eyebrow">Rest stop</p><p><strong>'+esc(rs.name)+'</strong> · '+esc(rs.address)+mapLink(rs.map||((rs.name||"")+", "+(rs.address||"")))+'</p><p>'+esc(rs.what)+'</p><p class="small faded">'+esc(rs.hours)+'</p>'+(rs.backup?'<p class="small"><strong>Backup:</strong> '+esc(rs.backup)+'</p>':'');
  if(sk)h+='<hr class="rule"><p class="eyebrow">'+esc(sk.kind||"Sunset spot")+'</p><p><strong>'+esc(sk.name)+'</strong> · '+esc(sk.address)+mapLink(sk.map)+'</p><p>'+esc(sk.notes)+'</p>';
  h+='<hr class="rule"><p class="eyebrow">Cost for two</p><dl class="facts"><dt>Gas</dt><dd>'+esc(co.gas)+'</dd><dt>Food</dt><dd>'+esc(co.food)+'</dd><dt>Entry</dt><dd>'+esc(co.entry)+'</dd><dt>Total</dt><dd><strong>'+esc(co.total)+'</strong></dd></dl>'+(co.notes?'<p class="small faded">'+esc(co.notes)+'</p>':'');
  return h+'</section>';

function safetyCard(q){
  var s=q.safety||{};
  return '<section class="page"><div class="safety"><p class="eyebrow" style="color:var(--pine)">Safety card</p><dl class="facts">'+
   '<dt>Cell signal</dt><dd>'+esc(s.cell)+'</dd><dt>Nearest gas</dt><dd>'+esc(s.gas)+mapLink(s.gasMap||firstBit(s.gas))+'</dd><dt>Nearest hospital</dt><dd>'+esc(s.hospital)+mapLink(s.hospitalMap||firstBit(s.hospital))+'</dd><dt>Back by</dt><dd><strong>'+esc(s.backBy)+'</strong></dd></dl>'+
   (s.notes?'<p class="small">'+esc(s.notes)+'</p>':'')+'<p class="small faded">In an emergency, call 911 first.</p></div></section>';

function sourcesBlock(q){
  var src=(q.sources||[]).filter(function(s){return safeUrl(s.url)});

  return h+'</details></section>';
}
function challengePreview(q){
  var ch=q.challenges||{};
  return '<section class="page"><p class="eyebrow">What awaits</p><ul class="plain">'+
   '<li>'+(ch.coop||[]).length+' co-op challenges to do together</li><li>'+(ch.duels||[]).length+' duels, fought side by side</li>'+
   '<li>A secret objective for each of you, hidden until the end</li><li>The boss: <strong>'+esc((ch.boss||{}).name)+'</strong></li></ul></section>';
}
function confirmBox(id,text,yes,act){
  if(S.confirm!==id)return "";
  return '<div class="secret"><p>'+esc(text)+'</p><div class="row"><button class="btn sm warn" data-act="'+act+'">'+esc(yes)+'</button><button class="btn sm ghost" data-act="cancel">Never mind</button></div></div>';
}
function briefing(q,run){
  return conditions(q)+planBlock(q)+safetyCard(q)+challengePreview(q)+
   '<section class="page"><p>Accepting rolls this week\'s random modifier. Either of you can veto instead. A veto costs nothing and earns a little XP for good judgment.</p>'+
   '<div class="row"><button class="btn" data-act="accept">Accept the quest</button><button class="btn warn" data-act="ask" data-v="veto">Veto</button></div>'+
   confirmBox("veto","Veto this quest? No penalty. A new one arrives Friday.","Yes, veto it","veto")+'</section>'+sourcesBlock(q);
}
function tick(act,key,on,label,extra){return '<label class="tick"><input type="checkbox" data-act="'+act+'" data-k="'+esc(key)+'" '+(on?"checked":"")+'><span>'+label+(extra||"")+'</span></label>'}
function preflight(q,run){
  var pre=run.pre||{},all=pre.share&&pre.oneCar&&WINTER.every(function(w){return pre[w[0]]});
  return '<section class="page"><p class="eyebrow">Before you leave the driveway</p>'+
   tick("pre","share",pre.share,"<strong>We've shared our live location with a trusted person</strong> and told them we'll be back by "+esc((q.safety||{}).backBy)+".")+
   tick("pre","oneCar",pre.oneCar,"<strong>One car, together the whole way.</strong> Nobody splits up, even for a minute.")+
   '<hr class="rule"><p class="eyebrow">Winter checklist</p>'+WINTER.map(function(w){return tick("pre",w[0],pre[w[0]],esc(w[1]))}).join("")+
   '<div class="row"><button class="btn" data-act="setOut" '+(all?"":"disabled")+'>Set out</button>'+(all?'':'<span class="small faded">Tick everything to unlock the road.</span>')+'</div></section>'+
   conditions(q)+planBlock(q)+safetyCard(q)+
   '<section class="page"><div class="row"><button class="btn warn sm" data-act="ask" data-v="veto">Veto after all</button></div>'+confirmBox("veto","Veto this quest? No penalty.","Yes, veto it","veto")+'</section>';
}
function secretCards(q){
  var pool=((q.challenges||{}).secrets)||[];if(!pool.length)return "";
  var ids=mine();if(!ids.length)return '<section class="page">'+whoPicker()+'</section>';
  return '<section class="page"><p class="eyebrow">Secret objectives</p>'+ids.map(function(pid){
    var i=secretIndex(q,pid),open=S.peek[pid];
    return '<div class="secret"><p><strong>For '+esc(pname(pid))+'\'s eyes only.</strong></p>'+
     (open?'<p class="note">'+esc(pool[i])+'</p><p class="small faded">Do it with your partner right beside you. Never go off alone for it.</p>':'<p class="faded">Hidden. Make sure '+esc(pname(other(pid)))+' isn\'t looking.</p>')+
     '<div><button class="btn sm ghost" data-act="peek" data-v="'+pid+'">'+(open?"Hide it":"Peek")+'</button></div></div>'}).join("")+
   '<p class="small faded">Your secret lives on this phone only. It reaches the shared log when you reveal it at home.</p></section>';
}
function winnerSeg(act,id,val){
  return '<div class="seg">'+[["p1",pname("p1")],["p2",pname("p2")],["tie","Tie"]].map(function(o){
    return '<button data-act="'+act+'" data-k="'+esc(id)+'" data-v="'+o[0]+'" aria-pressed="'+(val===o[0])+'">'+esc(o[1])+'</button>'}).join("")+'</div>';
}
function challengeBlocks(q,run){
  var ch=q.challenges||{},b=ch.boss||{};
  var cd=(ch.coop||[]).filter(function(c){return run.coop&&run.coop[c.id]}).length,dd=(ch.duels||[]).filter(function(d){return run.duels&&run.duels[d.id]}).length;
  var h='<section class="page"><p class="eyebrow">Co-op · do these together<span class="count">'+cd+' of '+(ch.coop||[]).length+' done</span></p>';
  h+=(ch.coop||[]).map(function(c){var on=run.coop&&run.coop[c.id];
    return '<div class="chal '+(on?"done":"")+'">'+tick("coop",c.id,on,"<strong>"+esc(c.title)+".</strong> "+esc(c.text))+'</div>'}).join("");
  h+='</section><section class="page"><p class="eyebrow">Duels · side by side, winner takes the points<span class="count">'+dd+' of '+(ch.duels||[]).length+' settled</span></p>';
  h+=(ch.duels||[]).map(function(d){var w=run.duels&&run.duels[d.id];
    var tv=d.trivia?'<details'+dOpen("triv:"+d.id)+'><summary class="small" style="cursor:pointer">Trivia questions (one of you reads, the other answers, then swap)</summary><ol class="plain" style="margin-top:6px">'+d.trivia.map(function(t,i){var k=d.id+":"+i;
      return '<li>'+esc(t.q)+' '+(S.triv[k]?'<strong>'+esc(t.a)+'</strong>':'<button class="btn sm ghost" data-act="triv" data-k="'+esc(k)+'">Show answer</button>')+'</li>'}).join("")+'</ol></details>':'';
    return '<div class="chal '+(w?"done":"")+'"><p><strong>'+esc(d.title)+'.</strong> '+esc(d.text)+'</p>'+tv+winnerSeg("duel",d.id,w)+'</div>'}).join("");
  h+='</section>'+secretCards(q)+'<section class="page"><p class="eyebrow" style="color:var(--oxblood)">Boss</p><div class="chal boss"><h3>'+esc(b.name)+'</h3><p>'+esc(b.text)+'</p>';
  if(b.parts&&b.parts.length){var n=0;h+=b.parts.map(function(p,i){var on=run.bossParts&&run.bossParts["i"+i];if(on)n++;return tick("bossPart","i"+i,on,esc(p))}).join("");
    h+='<p class="small faded">'+n+' of '+b.parts.length+' found</p>'}
  h+='<div class="seg"><button data-act="boss" data-v="win" aria-pressed="'+(run.boss==="win")+'">We beat it</button><button data-act="boss" data-v="loss" aria-pressed="'+(run.boss==="loss")+'">It got us this time</button></div></div></section>';
  return h;
}
function bailBlock(){
  return '<section class="page"><p>Something feels off, the weather turned, or you\'re just done? Bail. It always counts as a win for good sense, and it pays out.</p><div><button class="btn warn" data-act="ask" data-v="bail">Bail out</button></div>'+
   confirmBox("bail","Bail on this quest and head home? You both earn XP, gold and a keepsake for making the call.","Yes, we're bailing","bail")+'</section>';
}

  var sf=q.safety||{},cn=q.conditions||{};

   planBlock(q)+challengeBlocks(q,run)+safetyCard(q)+

function revealBlock(q,run){
  var pool=((q.challenges||{}).secrets)||[];if(!pool.length)return "";

  ["p1","p2"].forEach(function(pid){

  });

function photoBlock(q,run,editable){
  var list=S.photos[q.id]||(S.photosLoaded?[]:null);
  var h='<section class="page"><p class="eyebrow">Photos</p>';
  if(!list){h+='<p class="faded">Looking for photos…</p>'}

}

  var by=mine()[0]||"p1",list=[].slice.call(files,0,8),chain=Promise.resolve();
  list.forEach(function(f,i){chain=chain.then(function(){
    return shrink(f,1000,0.7).then(function(d){return d.length>230000?shrink(f,760,0.6):d}).then(function(d){
      if(d.length>250000)throw {code:"too_big"};
      return S.db.collection("photos").add({q:qid,by:by,at:Date.now()+i,data:d}).then(function(){
        var run=S.runs[qid]||{};if(run.thumb)return;return shrink(f,160,0.6).then(function(t){return runPatch(qid,{thumb:t})})})})})});
  chain.catch(function(e){if(e&&e.code==="invalid_argument")S.readOnly=true;else S.err=e&&e.code==="quota_exceeded"?"The journal is full. Remove some older photos first.":"A photo couldn't be saved. Try a different one."})
   .then(function(){S.photoBusy=false;render()});
}

/* ---------- story ---------- */
function storyFacts(q,run){
  var ch=q.challenges||{},L=[];
  L.push("Quest: "+q.title+" at "+(q.place||{}).name+", "+(q.place||{}).address+".");
  L.push("About the place: "+q.why);
  ["p1","p2"].forEach(function(pid){var p=(S.party&&S.party[pid])||{};L.push("Adventurer: "+pname(pid)+", a "+((CLASSES[p.cls]||{}).n||"traveler")+".")});
  if(run.modifier)L.push("Modifier this week: "+run.modifier.name+" ("+(run.modOk==="yes"?"kept":"not kept")+").");
  (ch.coop||[]).forEach(function(c){if(run.coop&&run.coop[c.id])L.push("Did together: "+c.title+".")});
  (ch.duels||[]).forEach(function(d){var w=run.duels&&run.duels[d.id];if(w)L.push("Duel '"+d.title+"': "+(w==="tie"?"tied":pname(w)+" won")+".")});
  ["p1","p2"].forEach(function(pid){var r=run.reveals&&run.reveals[pid];if(r)L.push(pname(pid)+"'s secret objective was '"+r.text+"' and they "+(r.ok?"pulled it off":"did not manage it")+".")});
  if(run.boss)L.push("Boss '"+((ch.boss||{}).name)+"': "+(run.boss==="win"?"beaten":"not beaten")+".");
  if(q.restStop)L.push("Rest stop: "+q.restStop.name+".");
  if(q.skySpot)L.push("Sunset or sky spot: "+q.skySpot.name+".");
  return L;
}
function plainStory(q,run){
  var ch=q.challenges||{},a=pname("p1"),b=pname("p2"),s="Quest No. "+q.number+". "+a+" and "+b+" set out in the trusty Sentra for "+(q.place||{}).name+". ";
  var co=(ch.coop||[]).filter(function(c){return run.coop&&run.coop[c.id]}).length;
  if(co)s+="Together they cleared "+co+" co-op challenge"+(co===1?"":"s")+". ";
  (ch.duels||[]).forEach(function(d){var w=run.duels&&run.duels[d.id];if(w)s+=(w==="tie"?"The duel of "+d.title+" ended in a tie. ":pname(w)+" took the duel of "+d.title+". ")});
  if(run.boss)s+=(run.boss==="win"?"The boss, "+(ch.boss||{}).name+", fell to the party. ":"The boss, "+(ch.boss||{}).name+", lives to be challenged again. ");
  return s+"Then home, safe and checked in, with one more place on the map.";
}
function writeStory(q,run){
  S.storyErr="";
  if(!S.sample){runPatch(q.id,{story:plainStory(q,run)});return}
  S.storyBusy=true;render();
  var prompt="Write a short adventure-log entry (140 to 190 words, plain text, no headings, no markdown) for a couple's real-life road trip game. Tell it like a fond, slightly mock-heroic journal entry in the past tense, in third person, using the adventurers' names. Use ONLY the facts below. Do not invent details about the place, the weather, other people, or anything that was not listed. Keep it warm and funny, never mean about either person.\n\nFacts:\n- "+storyFacts(q,run).join("\n- ");
  S.sample(prompt,{model:"claude-fable-5-2",cache:false}).then(function(r){S.storyBusy=false;return runPatch(q.id,{story:r.text.trim()})})
   .catch(function(e){S.storyBusy=false;var c=e&&e.code;
     if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"||c==="not_declared"){S.sample=null;runPatch(q.id,{story:plainStory(q,run)})}
     else{S.storyErr=c==="rate_limited"?"Too many requests just now. Try again in a bit, or write it yourself.":"That didn't work. Try again, or write it yourself.";render()}});
}

/* ---------- finishing ---------- */
function seal(q,run){
  var rw=computeRewards(q,run),ch=q.challenges||{},used={};
  Object.keys(S.runs).forEach(function(k){var r=S.runs[k].rewards;if(r)["p1","p2"].forEach(function(p){((r[p]||{}).loot||[]).forEach(function(l){used[l]=1})})});
  var free=LOOT.filter(function(l){return !used[l]});if(free.length<2)free=LOOT.slice();
  var w1=0,w2=0;Object.keys(run.duels||{}).forEach(function(k){if(run.duels[k]==="p1")w1++;if(run.duels[k]==="p2")w2++});
  ["p1","p2"].forEach(function(pid){rw[pid].loot=[];rw[pid].titles=[];
    if(run.boss==="win"){var i=Math.floor(Math.random()*free.length);rw[pid].loot.push(free.splice(i,1)[0]);if(ch.boss&&ch.boss.loot)rw[pid].loot.push(ch.boss.loot)}});
  var short=(q.place||{}).short||(q.place||{}).name;
  if(w1>w2)rw.p1.titles.push("Duelist of "+short);else if(w2>w1)rw.p2.titles.push("Duelist of "+short);
  var n=(S.photos[q.id]||[]).length;
  runPatch(q.id,{status:"done",doneAt:Date.now(),rewards:rw,photoCount:n,story:run.story||plainStory(q,run)});
}
function flatReward(xp,gold,why,loot){var o={};["p1","p2"].forEach(function(p){o[p]={xp:xp,gold:gold,lines:[why+" +"+xp+" XP"+(gold?", +"+gold+" gold":"")],loot:loot?[loot]:[],titles:[]}});return o}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var lb=e.target.closest(".light");if(lb){lb.remove();return}
  var im=e.target.closest(".photos img");
  if(im){var bx=document.createElement("div");bx.className="light";bx.setAttribute("role","dialog");bx.setAttribute("aria-label","Photo. Tap to close.");
    var big=document.createElement("img");big.src=im.src;big.alt=im.alt;bx.appendChild(big);document.body.appendChild(bx);return}
  var tb=e.target.closest("[data-tab]");
  if(tb){S.tab=tb.dataset.tab;lsSet("rq.tab",S.tab);S.confirm="";render();window.scrollTo(0,0);return}
  var el=e.target.closest("[data-act]");if(!el||el.tagName==="INPUT")return;
  var act=el.dataset.act,k=el.dataset.k,v=el.dataset.v,q=currentQuest(),run=q?(S.runs[q.id]||{}):{};
  if(act==="clearErr"){S.err="";render()}
  else if(act==="who"){S.who=v;lsSet("rq.who",v);S.peek={};render()}
  else if(act==="open"){S.qid=el.dataset.q;S.confirm="";render();window.scrollTo(0,0)}
  else if(act==="entry"){S.openEntry=el.dataset.q;S.tab="scrapbook";render();var d=document.querySelector('[data-entry="'+el.dataset.q+'"]');if(d)d.scrollIntoView({block:"start"})}
  else if(act==="ask"){S.confirm=v;render()}
  else if(act==="cancel"){S.confirm="";render()}
  else if(act==="peek"){S.peek[v]=!S.peek[v];render()}
  else if(act==="triv"){S.triv[k]=true;render()}
  else if(act==="stat"){var d2=S.draft[el.dataset.p],cur=(d2.stats[k]||0)+(+v);if(cur<0||(+v>0&&spent(d2)>=START_POINTS))return;d2.stats[k]=cur;render()}
  else if(act==="found"){var b={created:Date.now()};["p1","p2"].forEach(function(p){b[p]={name:S.draft[p].name.trim().slice(0,24),cls:S.draft[p].cls,stats:S.draft[p].stats}});partySet(b);if(!S.who){S.who="both";lsSet("rq.who","both")}}
  else if(act==="editParty"){S.edit={};["p1","p2"].forEach(function(p){var c=S.party[p]||{};S.edit[p]={name:c.name||"",cls:c.cls||"pathfinder"}});render()}
  else if(act==="cancelEdit"){S.edit=null;render()}
  else if(act==="saveParty"){var pe={};["p1","p2"].forEach(function(p){var nm=($("en-"+p)||{}).value,cs=($("ec-"+p)||{}).value;
      pe[p]={name:String(nm||"").trim().slice(0,24)||pname(p),cls:CLASSES[cs]?cs:S.edit[p].cls}});S.edit=null;partyPatch(pe);render()}
  else if(act==="spend"){var pid=el.dataset.p,p=S.party[pid]||{},pt={};pt[pid]={stats:{}};pt[pid].stats[k]=((p.stats&&p.stats[k])||0)+1;partyPatch(pt)}
  else if(!q)return;
  else if(act==="accept"){var mods=(q.modifiers||[]).filter(function(m){return !m.night||q.nightOk===true});
    var m=mods.length?mods[Math.floor(Math.random()*mods.length)]:null;runPatch(q.id,{status:"accepted",modifier:m,acceptedAt:Date.now()});window.scrollTo(0,0)}
  else if(act==="veto"){S.confirm="";runPatch(q.id,{status:"vetoed",doneAt:Date.now(),rewards:flatReward(5,0,"Wise veto")})}
  else if(act==="setOut"){runPatch(q.id,{status:"out",outAt:Date.now()});window.scrollTo(0,0)}
  else if(act==="bail"){S.confirm="";runPatch(q.id,{status:"bailed",doneAt:Date.now(),rewards:flatReward(20,10,"Tactical retreat","Token of the Tactical Retreat")});window.scrollTo(0,0)}
  else if(act==="home"){runPatch(q.id,{status:"home",homeAt:Date.now()});window.scrollTo(0,0)}
  else if(act==="duel"){var o={duels:{}};o.duels[k]=(run.duels&&run.duels[k]===v)?"":v;runPatch(q.id,o)}
  else if(act==="boss"){runPatch(q.id,{boss:run.boss===v?"":v})}
  else if(act==="modOk"){runPatch(q.id,{modOk:v})}
  else if(act==="reveal"||act==="revealFor"){var pool=(q.challenges||{}).secrets||[],idx;
    if(act==="reveal")idx=secretIndex(q,k);else{var sel=$("rev-"+k);idx=sel?+sel.value:0}
    var rv={reveals:{}};rv.reveals[k]={text:pool[idx]||"",ok:v==="1"};runPatch(q.id,rv)}
  else if(act==="story"){var ta=$("story");if(ta&&ta.value!==(run.story||""))run=Object.assign({},run,{story:ta.value});writeStory(q,run)}
  else if(act==="seal"){var ts=$("story");if(ts&&ts.value.trim()&&ts.value!==(run.story||""))run=Object.assign({},run,{story:ts.value.slice(0,4000)});seal(q,run);window.scrollTo(0,0)}
  else if(act==="delPhoto"){if(S.confirm!=="del:"+k){S.confirm="del:"+k;el.textContent="tap again";return}
    S.confirm="";S.db.doc("photos/"+k).delete().then(function(){render()}).catch(function(){S.err="That photo couldn't be removed.";render()})}
});
document.addEventListener("change",function(e){
  var t=e.target,q=currentQuest();
  if(t.dataset.cls){if(S.draft){S.draft[t.dataset.cls].cls=t.value;render()}return}
  if(t.dataset.ecls){if(S.edit)S.edit[t.dataset.ecls].cls=t.value;return}
  if(t.dataset.ename)return;
  if(t.id==="photoIn"&&q){addPhotos(q.id,t.files);return}
  if(!q)return;var run=S.runs[q.id]||{},act=t.dataset.act,k=t.dataset.k,o;
  if(act==="pre"){o={pre:{}};o.pre[k]=t.checked;runPatch(q.id,o)}
  else if(act==="coop"){o={coop:{}};o.coop[k]=t.checked;runPatch(q.id,o)}
  else if(act==="bossPart"){o={bossParts:{}};o.bossParts[k]=t.checked;runPatch(q.id,o)}
  else if(act==="checkin"){runPatch(q.id,{checkin:t.checked})}
  else if(t.dataset.spend){o={spend:{}};o.spend[t.dataset.spend]=t.value===""?null:Math.max(0,+t.value||0);runPatch(q.id,o)}
  else if(t.dataset.story){if(t.value!==(run.story||""))runPatch(q.id,{story:t.value.slice(0,4000)})}
});
document.addEventListener("input",function(e){var t=e.target;
  if(t.dataset.ename&&S.edit){S.edit[t.dataset.ename].name=t.value;return}
  if(t.dataset.name&&S.draft){S.draft[t.dataset.name].name=t.value;
    var sl=t.closest(".row")&&t.closest(".row").querySelector(".seal");if(sl)sl.textContent=(t.value.trim()||"?").charAt(0).toUpperCase();
    var b=document.querySelector('[data-act="found"]');if(b){var d=S.draft;b.disabled=!(d.p1.name.trim()&&d.p2.name.trim()&&spent(d.p1)===START_POINTS&&spent(d.p2)===START_POINTS)}}
});
document.addEventListener("click",function(){if(queued&&!pressing){queued=false;render()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var lb=document.querySelector(".light");if(lb)lb.remove()}});
document.addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.d){S.open[d.dataset.d]=d.open;return}
  if(d.dataset&&d.dataset.entry){var was=S.openEntry===d.dataset.entry;if(d.open&&!was){S.openEntry=d.dataset.entry;render()}else if(!d.open&&was){S.openEntry=null;render()}}},true);

render();boot();
})();
</script>
